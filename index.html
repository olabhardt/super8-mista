<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071b17"><title>Super 8 Mista</title><style>*{box-sizing:border-box}body{margin:0;background:#061713;color:#f6fbf8;font-family:system-ui,-apple-system,sans-serif}.app{max-width:620px;margin:auto;padding:14px 14px 36px}.hero,.card{background:#0c2922;border:1px solid #ffffff17;border-radius:20px;padding:16px;margin-bottom:11px}.hero{background:linear-gradient(145deg,#103a30,#0a241e)}.k{font-size:11px;font-weight:900;letter-spacing:.12em;color:#79e2bd}.hero h1{margin:5px 0 3px}.muted{color:#a8c2b9;font-size:12px}.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.badge{font-size:10px;font-weight:800;padding:6px 8px;border-radius:99px;background:#ffffff0c;border:1px solid #ffffff18}.pair,.match{margin:10px 0;padding:12px;border-radius:14px;background:#071e19;border:1px solid #ffffff15}.pair b,.court{font-size:10px;color:#d8ff4f;letter-spacing:.08em}.inputs{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}input{width:100%;min-width:0;background:#041510;color:#fff;border:1px solid #ffffff20;border-radius:11px;padding:11px;outline:none}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:10px 0}.tab,button{font:inherit;border:0;cursor:pointer}.tab{border:1px solid #ffffff16;background:#0a211c;color:#d6e3df;border-radius:11px;padding:9px 3px;font-size:10px;font-weight:800}.tab.on,.primary{background:#d8ff4f;color:#102019}.btn{width:100%;border-radius:13px;padding:13px;font-weight:900}.secondary{background:#173d33;color:#fff}.danger{background:#3a1c1e;color:#ffc5c8}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.team{display:grid;grid-template-columns:1fr 58px;gap:8px;align-items:center;margin:7px 0}.team b{font-size:13px}.score{width:58px;text-align:center;font-size:21px;font-weight:900}.valid{border-color:#70dfba66}.invalid{border-color:#ff7f8780}.help{font-size:10px;color:#ffadb2}.table{overflow:hidden;border:1px solid #ffffff17;border-radius:14px;margin-top:10px}table{width:100%;border-collapse:collapse;table-layout:fixed}th,td{padding:9px 3px;border-bottom:1px solid #ffffff12;text-align:center;font-size:10px}th:nth-child(2),td:nth-child(2){text-align:left;width:42%}.pos{font-weight:900;color:#d8ff4f}.note{padding:11px;border-radius:12px;background:#d8ff4f0c;border:1px solid #d8ff4f20;color:#bfd1cb;font-size:11px;line-height:1.45;margin-top:10px}.footer{text-align:center;color:#6f9186;font-size:10px;margin-top:18px}@media(max-width:400px){.inputs{grid-template-columns:1fr}.app{padding:10px}}</style></head><body><div class="app"><div class="hero"><div class="k">BEACH TENNIS • DUPLAS FIXAS</div><h1>Super 8 Mista</h1><div class="muted">8 duplas • 4 quadras • todos contra todos • 5 seco</div><div class="badges"><span class="badge">7 jogos</span><span class="badge">28 partidas</span><span class="badge">Ranking automático</span></div></div><div id="nav"></div><main id="main"></main><div class="footer">Placares salvos automaticamente neste aparelho</div></div><script>
const KEY="s8-mista-fixa-8-v1";function makeSchedule(){let a=[0,1,2,3,4,5,6,7],R=[];for(let r=0;r<7;r++){let games=[];for(let i=0;i<4;i++)games.push({a:a[i],b:a[7-i],c:i+1});R.push(games);a=[a[0],a[7],...a.slice(1,7)]}return R}const SCH=makeSchedule();const fresh=()=>({view:"setup",pairs:Array.from({length:8},()=>["",""]),scores:SCH.map(r=>r.map(()=>["",""])),ready:false});let s;try{s=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){}if(!s)s=fresh();const save=()=>localStorage.setItem(KEY,JSON.stringify(s)),esc=x=>String(x||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),pn=i=>s.pairs[i].filter(Boolean).join(" + ");function norm(){if(!Array.isArray(s.pairs)||s.pairs.length!==8)s.pairs=fresh().pairs;s.pairs=s.pairs.map(p=>Array.isArray(p)?[p[0]||"",p[1]||""]:["",""]);s.scores=SCH.map((r,ri)=>r.map((_,mi)=>{let x=s.scores?.[ri]?.[mi];return Array.isArray(x)?[x[0]??"",x[1]??""]:["",""]}));if(!["home","setup","edit","r0","r1","r2","r3","r4","r5","r6","rank"].includes(s.view))s.view=s.ready?"r0":"setup"}function ok(a,b){a=+a;b=+b;return Number.isInteger(a)&&Number.isInteger(b)&&a>=0&&b>=0&&((a===5&&b<5)||(b===5&&a<5))}
function home(){return `<section class="card"><h2>Início</h2><div class="muted">Há um Super 8 em andamento. Você pode continuar de onde parou ou começar outro.</div><button class="btn primary" style="margin-top:14px" id="resume">Continuar Super 8 →</button><button class="btn secondary" style="margin-top:8px" id="newGame">+ Criar novo Super 8</button></section>`}
function setup(edit=false){return `<section class="card"><h2>${edit?"Editar atletas":"Cadastre as duplas"}</h2><div class="muted">${edit?"Troque apenas o nome necessário. As duplas, jogos e placares já lançados serão mantidos.":"Cadastre as 8 duplas. Cada dupla deve ter uma atleta feminina e um atleta masculino."}</div>${s.pairs.map((p,i)=>`<div class="pair"><b>DUPLA ${i+1}</b><div class="inputs"><input data-p="${i}-0" value="${esc(p[0])}" placeholder="Atleta feminina"><input data-p="${i}-1" value="${esc(p[1])}" placeholder="Atleta masculino"></div></div>`).join("")}${edit?`<button class="btn primary" id="saveNames">Salvar alterações →</button>`:`<button class="btn primary" id="start">Iniciar Super 8 →</button>`}</section>${edit?"":`<section class="card"><h2>Formato</h2><div class="note">Cada dupla enfrenta as outras sete uma vez, em 7 jogos com 4 partidas simultâneas. Partidas em <b>5 seco</b>: vence quem chegar primeiro a 5 games. O ranking usa os critérios de round robin da ITF adaptados ao jogo único.</div></section>`}`}
function nav(){document.getElementById("nav").innerHTML=!s.ready?"":`<div class="tabs">${[["r0","Jogo 1"],["r1","Jogo 2"],["r2","Jogo 3"],["r3","Jogo 4"],["r4","Jogo 5"],["r5","Jogo 6"],["r6","Jogo 7"],["rank","Ranking"]].map(x=>`<button class="tab ${s.view===x[0]?"on":""}" data-go="${x[0]}">${x[1]}</button>`).join("")}</div><div class="grid2" style="margin-bottom:10px"><button class="btn secondary" data-go="home">⌂ Home</button><button class="btn secondary" data-go="edit">✎ Editar atletas</button></div>`}
function round(ri){return `<section class="card"><h2>Jogo ${ri+1}</h2><div class="muted">4 partidas simultâneas • 4 quadras</div>${SCH[ri].map((m,mi)=>{let q=s.scores[ri][mi],filled=q[0]!==""&&q[1]!=="",v=filled&&ok(...q);return `<div class="match ${v?"valid":filled?"invalid":""}"><div class="court">QUADRA ${m.c}</div><div class="team"><b>${esc(pn(m.a))}</b><input class="score" type="number" inputmode="numeric" min="0" max="5" data-s="${ri}-${mi}-0" value="${q[0]}"></div><div class="team"><b>${esc(pn(m.b))}</b><input class="score" type="number" inputmode="numeric" min="0" max="5" data-s="${ri}-${mi}-1" value="${q[1]}"></div>${filled&&!v?`<div class="help">Placar inválido: uma dupla precisa ter 5 e a outra de 0 a 4.</div>`:""}</div>`}).join("")}<div class="grid2"><button class="btn secondary" data-go="${ri?"r"+(ri-1):"rank"}">${ri?"← Anterior":"Ver ranking"}</button><button class="btn primary" data-go="${ri<6?"r"+(ri+1):"rank"}">${ri<6?"Próximo →":"Ranking →"}</button></div></section>`}
function stats(){let A=Array.from({length:8},(_,i)=>({i,w:0,gf:0,ga:0,h:{}}));SCH.forEach((r,ri)=>r.forEach((m,mi)=>{let[x,y]=s.scores[ri][mi];if(!ok(x,y))return;x=+x;y=+y;A[m.a].gf+=x;A[m.a].ga+=y;A[m.b].gf+=y;A[m.b].ga+=x;if(x>y){A[m.a].w++;A[m.a].h[m.b]=1;A[m.b].h[m.a]=-1}else{A[m.b].w++;A[m.b].h[m.a]=1;A[m.a].h[m.b]=-1}}));return A}function tie(g,A){if(g.length===2){let h=A[g[0]].h[g[1]]||0;if(h)return h>0?g:[g[1],g[0]]}let z=[...g].sort((a,b)=>(A[b].gf/(A[b].gf+A[b].ga||1))-(A[a].gf/(A[a].gf+A[a].ga||1))),o=[];for(let i=0;i<z.length;){let p=A[z[i]].gf/(A[z[i]].gf+A[z[i]].ga||1),j=i+1;while(j<z.length&&Math.abs(A[z[j]].gf/(A[z[j]].gf+A[z[j]].ga||1)-p)<1e-12)j++;let t=z.slice(i,j);if(t.length===2){let h=A[t[0]].h[t[1]]||0;if(h<0)t.reverse()}o.push(...t);i=j}return o}
function rank(){let A=stats(),G={};A.forEach(x=>(G[x.w]??=[]).push(x.i));let O=[];Object.keys(G).map(Number).sort((a,b)=>b-a).forEach(w=>O.push(...tie(G[w],A)));return `<section class="card"><h2>Ranking</h2><div class="muted">Atualização automática com placares válidos.</div><div class="table"><table><tr><th>#</th><th>Dupla</th><th>V</th><th>GF</th><th>GC</th><th>%G</th></tr>${O.map((id,i)=>{let x=A[id],p=x.gf+x.ga?100*x.gf/(x.gf+x.ga):0;return `<tr><td class="pos">${i+1}</td><td>${esc(pn(id))}</td><td>${x.w}</td><td>${x.gf}</td><td>${x.ga}</td><td>${p.toFixed(1)}%</td></tr>`}).join("")}</table></div><div class="note"><b>Desempate:</b> vitórias; empate de 2 duplas: confronto direto. Empate de 3 ou mais: porcentagem de games ganhos; se restarem 2, confronto direto. Persistindo empate, a ITF prevê sorteio. Como este Super 8 usa um único bloco de 5 seco por confronto, a porcentagem de sets não diferencia as duplas.</div><div class="grid2" style="margin-top:10px"><button class="btn secondary" data-go="r0">← Jogos</button><button class="btn danger" id="reset">Novo Super 8</button></div></section>`}
function bind(){document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{s.view=b.dataset.go;save();render()});document.querySelectorAll("[data-p]").forEach(i=>i.oninput=()=>{let[a,b]=i.dataset.p.split("-").map(Number);s.pairs[a][b]=i.value;save()});document.querySelectorAll("[data-s]").forEach(i=>i.oninput=()=>{let[r,m,k]=i.dataset.s.split("-").map(Number);s.scores[r][m][k]=i.value;save()});let b=document.getElementById("start");if(b)b.onclick=()=>{if(s.pairs.flat().some(x=>!x.trim()))return alert("Preencha os 16 atletas.");s.ready=true;s.view="r0";save();render()};b=document.getElementById("saveNames");if(b)b.onclick=()=>{if(s.pairs.flat().some(x=>!x.trim()))return alert("Nenhum atleta pode ficar sem nome.");s.view="r0";save();render()};b=document.getElementById("resume");if(b)b.onclick=()=>{s.view="r0";save();render()};b=document.getElementById("newGame");if(b)b.onclick=()=>{if(confirm("Criar um novo Super 8? Os nomes e placares atuais serão apagados.")){s=fresh();save();render()}};b=document.getElementById("reset");if(b)b.onclick=()=>{if(confirm("Apagar o Super 8 atual e começar outro?")){s=fresh();save();render()}}}function render(){norm();nav();let m=document.getElementById("main");try{m.innerHTML=s.view==="home"&&s.ready?home():!s.ready||s.view==="setup"?setup():s.view==="edit"?setup(true):s.view==="rank"?rank():round(+s.view.slice(1));bind()}catch(e){console.error(e);m.innerHTML='<section class="card"><h2>Erro ao abrir</h2><div class="muted">Os dados continuam salvos. Recarregue a página.</div></section>'}}norm();save();render();
</script></body></html>
